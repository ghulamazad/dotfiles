# ── Video ─────────────────────────────────────────────────────────────
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk

# Intel hardware decoding
hwdec=vaapi
hwdec-codecs=all

# High-quality scaling
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
sigmoid-upscaling=yes

# HDR / colour
target-colorspace-hint=yes

# ── Audio ─────────────────────────────────────────────────────────────
audio-pitch-correction=yes
volume-max=150
af=acompressor

# ── Subtitles ─────────────────────────────────────────────────────────
sub-auto=fuzzy
sub-font=VictorMono Nerd Font
sub-font-size=44
sub-border-size=2.5
sub-color='#FFFFFFFF'
sub-border-color='#CC000000'
sub-shadow-offset=1
sub-shadow-color='#80000000'
blend-subtitles=yes

# ── OSD ──────────────────────────────────────────────────────────────
osd-font=VictorMono Nerd Font
osd-font-size=36
osd-bar-h=2
osd-bar-align-y=-1
osd-duration=2000
osd-level=1

# ── UI / Window ───────────────────────────────────────────────────────
force-window=yes
keep-open=yes
save-position-on-quit=yes
geometry=60%
autofit-larger=100%x90%
border=no
cursor-autohide=1000

# ── Playback ──────────────────────────────────────────────────────────
loop-playlist=no
hr-seek=yes
speed=1.0

# ── Screenshots ───────────────────────────────────────────────────────
screenshot-format=png
screenshot-png-compression=3
screenshot-directory=~/Pictures/mpv
screenshot-template="%F_%wH%wM%wS"

# ── Cache ─────────────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB
