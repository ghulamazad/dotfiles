# lazygit config
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# Styled with Obsidian Plum & Sage Jade theme matching reference screenshot.

gui:
  theme:
    activeBorderColor:
      - '#7db6a7'
      - bold
    inactiveBorderColor:
      - '#31343d'
    optionsTextColor:
      - '#7db6a7'
    selectedLineBgColor:
      - '#295d50'
    selectedRangeBgColor:
      - '#295d50'
    cherryPickedCommitBgColor:
      - '#2b5147'
    cherryPickedCommitFgColor:
      - '#81beae'
    unstagedChangesColor:
      - '#d88d91'
    defaultFgColor:
      - '#c6bdce'
  nerdFontsVersion: "3"
  border: single
