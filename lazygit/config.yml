# lazygit config
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# Tokyo Night Night theme colours applied.

gui:
  theme:
    activeBorderColor:
      - '#7aa2f7'
      - bold
    inactiveBorderColor:
      - '#414868'
    optionsTextColor:
      - '#7aa2f7'
    selectedLineBgColor:
      - '#292e42'
    selectedRangeBgColor:
      - '#292e42'
    cherryPickedCommitBgColor:
      - '#1a2a1a'
    cherryPickedCommitFgColor:
      - '#9ece6a'
    unstagedChangesColor:
      - '#f7768e'
    defaultFgColor:
      - '#a9b1d6'
  nerdFontsVersion: "3"
  border: single
