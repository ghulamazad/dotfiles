# hypridle configuration (hypridle's own format, separate from Hyprland's Lua).
# NOTE: unverified against the newest hypridle release; if hypridle rejects
# this file, compare with `man hypridle` / the Hyprland wiki hypridle page.

general {
    # What "lock" means everywhere (loginctl lock-session, power menu, SUPER+L).
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Lock after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend after 15 minutes idle. Delete this block to never auto-suspend.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
