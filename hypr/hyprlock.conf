# hyprlock configuration matching Omarchy lock screen (Inventory §9).
# Minimal on purpose: dark Tokyo Night background, clock, password field.

general {
    hide_cursor = true
}

# Lock screen image: scripts/wallpaper.sh set-lock FILE writes this file;
# install.sh creates a plain-colour fallback.
source = ~/.local/state/dotfiles/hyprlock-bg.conf

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = VictorMono Nerd Font
    color = rgba(a9b1d6ff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 1
    inner_color = rgba(1a1b26cc)
    outer_color = rgba(a9b1d6ff)
    check_color = rgba(7aa2f7ff)
    fail_color = rgba(f7768eff)
    font_color = rgba(a9b1d6ff)
    font_family = VictorMono Nerd Font
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
