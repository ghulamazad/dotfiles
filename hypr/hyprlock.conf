# hyprlock configuration matching Tokyo Night Night theme.
# Palette: /usr/share/omarchy/themes/tokyo-night/colors.toml

general {
    hide_cursor = true
}

source = ~/.local/state/dotfiles/hyprlock-bg.conf

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = VictorMono Nerd Font
    color = rgba(a9b1d6ff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 1
    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f7ff)
    check_color = rgba(9ece6aef)
    fail_color = rgba(f7768eff)
    font_color = rgba(a9b1d6ff)
    font_family = VictorMono Nerd Font
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
