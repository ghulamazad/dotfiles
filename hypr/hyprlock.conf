# hyprlock configuration (hyprlock's own format, separate from Hyprland's Lua).
# NOTE: unverified against the newest hyprlock release; compare with the
# Hyprland wiki hyprlock page if it logs parse errors.
# Minimal on purpose: plain dark background, clock, password field.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(14161bff)
}

label {
    monitor =
    text = $TIME
    font_size = 72
    color = rgba(d8dee9ff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    inner_color = rgba(1c1f26ff)
    outer_color = rgba(7aa2f7ff)
    font_color = rgba(d8dee9ff)
    placeholder_text = Password
    position = 0, -40
    halign = center
    valign = center
}
