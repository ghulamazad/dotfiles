# hyprlock configuration matching Obsidian Plum & Sage Jade theme.

general {
    hide_cursor = true
}

source = ~/.local/state/dotfiles/hyprlock-bg.conf

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = VictorMono Nerd Font
    color = rgba(c2d8d8ff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 1
    inner_color = rgba(0c1618cc)
    outer_color = rgba(35d0c0ff)
    check_color = rgba(6cc48eef)
    fail_color = rgba(e0736eff)
    font_color = rgba(c2d8d8ff)
    font_family = VictorMono Nerd Font
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
