# hyprlock configuration matching Obsidian Plum & Sage Jade theme.

general {
    hide_cursor = true
}

source = ~/.local/state/dotfiles/hyprlock-bg.conf

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = VictorMono Nerd Font
    color = rgba(c6bdceff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 1
    inner_color = rgba(150f1dcc)
    outer_color = rgba(7db6a7ff)
    check_color = rgba(81beaeef)
    fail_color = rgba(d88d91ff)
    font_color = rgba(c6bdceff)
    font_family = VictorMono Nerd Font
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
