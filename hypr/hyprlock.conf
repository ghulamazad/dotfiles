general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/tanjiro-nezuko.jpg
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.9
    brightness = 0.82
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(35d0c0ee)
    inner_color = rgba(152325ff)
    font_color = rgb(c2d8d8)
    placeholder_text = <i>Enter password</i>
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y  •  %H:%M')"
    color = rgb(c2d8d8)
    font_size = 18
    font_family = VictorMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
