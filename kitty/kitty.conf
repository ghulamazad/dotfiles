# kitty.conf. Docs: https://sw.kovidgoyal.net/kitty/conf/

# --- Font ---------------------------------------------------------------
# Install with: pacman -S ttf-jetbrains-mono-nerd   (see packages/packages.txt)
# Ligatures are on by default in kitty; JetBrains Mono ships them.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- Performance --------------------------------------------------------
# Defaults are already fast; these trade a little power for lower input lag.
input_delay            1
repaint_delay          6
sync_to_monitor        yes

# --- Look ---------------------------------------------------------------
background_opacity     0.93
window_padding_width   8
confirm_os_window_close 0
enable_audio_bell      no
cursor_shape           block
cursor_blink_interval  0
scrollback_lines       20000
tab_bar_style          powerline
tab_powerline_style    slanted
hide_window_decorations yes

# --- Colors (matches themes/ in quickshell) ------------------------------
foreground             #d8dee9
background             #14161b
selection_foreground   #14161b
selection_background   #7aa2f7
cursor                 #7aa2f7
url_color              #7dcfff

color0  #1c1f26
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #d8dee9

active_tab_foreground   #14161b
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #1c1f26

# --- Shortcuts (kitty defaults plus a few) --------------------------------
# kitty_mod is ctrl+shift. Hyprland owns SUPER, so kitty never uses SUPER:
# no conflicts with window-manager binds.
map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_window
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+f5    load_config_file
