
# =============================================================================
# Tmux Configuration — Tokyo Night Night theme
# Palette: /usr/share/omarchy/themes/tokyo-night/colors.toml
#
# bg      : #1a1b26   surface  : #24283b   muted    : #414868
# fg      : #a9b1d6   green    : #9ece6a   teal     : #73daca
# blue    : #7aa2f7   yellow   : #e0af68   border   : #414868
# =============================================================================

# ── General Settings ─────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Prefix ───────────────────────────────────────────────────────────────────

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Configuration Management ─────────────────────────────────────────────────

# Reload configuration: Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Show all keybindings: Prefix + ?
bind ? list-keys

# ── Unified Status Bar ───────────────────────────────────────────────────────

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# Left side: Window tabs only
set -g status-left ""

# Window separator
set -g window-status-separator \
  "#[fg=#414868,bg=#24283b]|"

# Inactive windows
set -g window-status-format \
  "#[fg=#a9b1d6,bg=#24283b,nounderscore,nobold] #I:#W "

# Active window — bold, green, no underline
set -g window-status-current-format \
  "#[fg=#9ece6a,bg=#24283b,bold,nounderscore] #I:#W "

# Window activity
setw -g monitor-activity on
setw -g window-status-activity-style \
  "fg=#73daca,bg=#24283b,bold"

# Right side: Session + Clock
set -g status-right-length 60
set -g status-right \
  "#[fg=#9ece6a,bg=#24283b,bold] #S #[fg=#414868,bg=#24283b]|#[fg=#7aa2f7,bg=#24283b,bold] %I:%M %p "

# ── Pane Borders ─────────────────────────────────────────────────────────────

set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#9ece6a"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style "bg=#24283b,fg=#a9b1d6"
set -g message-command-style "bg=#24283b,fg=#a9b1d6"

# ── Copy Mode (Vi + Wayland Clipboard) ───────────────────────────────────────

setw -g mode-keys vi

# Begin selection
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy selection to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Copy mode colors
set -g mode-style "bg=#292e42,fg=#9ece6a"

# ── Splits & Windows (Preserve Current Path) ──────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-like Pane Navigation ─────────────────────────────────────────────────

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ── Pane Resizing ────────────────────────────────────────────────────────────

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Project Switching ────────────────────────────────────────────────────────

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# ── Clock ────────────────────────────────────────────────────────────────────

setw -g clock-mode-colour "#7aa2f7"
