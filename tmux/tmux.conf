
# =============================================================================
# Tmux Configuration — Obsidian Plum & Sage Jade Theme
# Palette matching the reference screenshot:
#
# bg          : #150f1d   surface     : #1e1727   selection/pill : #295d50
# fg          : #c6bdce   accent/sage : #7db6a7   mint/green     : #81beae
# light sage  : #9fbc79   border      : #31343d   muted          : #4f4657
# =============================================================================

# ── General Settings ─────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Prefix ───────────────────────────────────────────────────────────────────

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Configuration Management ─────────────────────────────────────────────────

# Reload configuration: Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Show all keybindings: Prefix + ?
bind ? list-keys

# ── Unified Status Bar ───────────────────────────────────────────────────────

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#150f1d,fg=#c6bdce"

# Left side: Window tabs only
set -g status-left ""

# Window separator
set -g window-status-separator \
  "#[fg=#31343d,bg=#1e1727]|"

# Inactive windows
set -g window-status-format \
  "#[fg=#c6bdce,bg=#1e1727,nounderscore,nobold] #I:#W "

# Active window — bold, sage jade, no underline
set -g window-status-current-format \
  "#[fg=#7db6a7,bg=#1e1727,bold,nounderscore] #I:#W "

# Window activity
setw -g monitor-activity on
setw -g window-status-activity-style \
  "fg=#81beae,bg=#1e1727,bold"

# Right side: Session + Clock
set -g status-right-length 60
set -g status-right \
  "#[fg=#7db6a7,bg=#1e1727,bold] #S #[fg=#31343d,bg=#1e1727]|#[fg=#81beae,bg=#1e1727,bold] %I:%M %p "

# ── Pane Borders ─────────────────────────────────────────────────────────────

set -g pane-border-style "fg=#31343d"
set -g pane-active-border-style "fg=#7db6a7"

# ── Messages ─────────────────────────────────────────────────────────────────

set -g message-style "bg=#1e1727,fg=#c6bdce"
set -g message-command-style "bg=#1e1727,fg=#c6bdce"

# ── Copy Mode (Vi + Wayland Clipboard) ───────────────────────────────────────

setw -g mode-keys vi

# Begin selection
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy selection to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Copy mode colors
set -g mode-style "bg=#295d50,fg=#f0faf4"

# ── Splits & Windows (Preserve Current Path) ──────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-like Pane Navigation ─────────────────────────────────────────────────

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ── Pane Resizing ────────────────────────────────────────────────────

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Project Switching ────────────────────────────────────────────────────────

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# ── Clock ────────────────────────────────────────────────────────────────────

setw -g clock-mode-colour "#7db6a7"
